name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # 실제 Postgres 컨테이너를 러너의 Docker로 실행한다.
      - run: pnpm test:db

      # 소스맵 업로드는 하지 않는다.
      - run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ''
