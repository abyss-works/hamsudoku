apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hamsudoku
spec:
  ingressClassName: nginx
  rules:
    - host: hamsudoku.abyssworks.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hamsudoku
                port:
                  number: 80
  tls:
    - hosts:
        - hamsudoku.abyssworks.dev
      secretName: hamsudoku-tls
