apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hamsudoku-prod
labels:
  - pairs:
      abyssworks.dev/project: hamsudoku
      abyssworks.dev/environment: prod
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml
  - cronjob-weekly-ranking-finalize.yaml
  - cronjob-daily-ranking-catchup.yaml
  - cronjob-daily-play-audit.yaml
  - cronjob-endless-supply.yaml
  - db.yaml
  - db-backup.yaml
# 태그는 package.json의 버전과 같아야 한다.
images:
  - name: ghcr.io/abyss-works/hamsudoku
    newTag: v0.8.2
