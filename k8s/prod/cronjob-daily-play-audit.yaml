apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-play-audit
spec:
  schedule: "30 19 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hamsudoku
                      key: CRON_SECRET
              command:
                - sh
                - -c
                - >-
                  curl -fsS -m 300 -X POST
                  -H "Authorization: Bearer $CRON_SECRET"
                  -H "Content-Type: application/json"
                  http://hamsudoku/api/internal/play-audit
